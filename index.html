
<!DOCTYPE html>
<html>
<head>
    <title>User Input Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding-top: 100px;
        }

        .container {
            background: white;
            width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 20px;
        }

        button {
            padding: 10px 25px;
            background-color: #4285f4;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Search / User Input</h2>

        <form action="https://formsubmit.co/relicofrhofl11@gmail.com"
              method="POST">

            <input type="text"
                   name="user_message"
                   placeholder="Enter your text here..."
                   required>

            <input type="hidden" name="_subject"
                   value="New User Input">

            <button type="submit">Submit</button>

        </form>
    </div>

</body>
</html>
