
<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e6f0ff;
            text-align: center;
            padding-top: 100px;
        }

        .login-box {
            background: white;
            width: 300px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            padding: 10px 25px;
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Login Page</h2>

        <form>
            <input type="text"
                   placeholder="Enter Username"
                   required>

            <input type="password"
                   placeholder="Enter Password"
                   required>

            <button type="button">Login</button>
        </form>
    </div>

</body>
</html>
